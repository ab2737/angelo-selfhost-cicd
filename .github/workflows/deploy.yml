name: Build Test and Deploy

on:
  push:
    branches:
      - main
      - qa

permissions:
  contents: read
  packages: write

jobs:
  build-test-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select environment
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')

          if [ "${GITHUB_REF_NAME}" = "qa" ]; then
            echo "DEPLOY_ENV=qa" >> "$GITHUB_ENV"
            echo "SERVICE=qa" >> "$GITHUB_ENV"
          else
            echo "DEPLOY_ENV=prod" >> "$GITHUB_ENV"
            echo "SERVICE=production" >> "$GITHUB_ENV"
          fi

          echo "IMAGE=ghcr.io/${OWNER}/${REPO}" >> "$GITHUB_ENV"

      - name: Validate website
        run: |
          test -f index.html
          test -f Dockerfile
          grep -q "Angelo" index.html

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -t "${IMAGE}:${DEPLOY_ENV}" \
            -t "${IMAGE}:${GITHUB_SHA}" \
            .

      - name: Test image
        run: |
          docker run -d --name website-test -p 8080:80 "${IMAGE}:${DEPLOY_ENV}"

          for i in {1..10}; do
            if curl -fsS http://127.0.0.1:8080 | grep -q "Angelo"; then
              echo "Website test passed"
              exit 0
            fi
            sleep 1
          done

          docker logs website-test
          exit 1

      - name: Push image
        run: |
          docker push "${IMAGE}:${DEPLOY_ENV}"
          docker push "${IMAGE}:${GITHUB_SHA}"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy deployment config
        run: |
          scp -i ~/.ssh/deploy_key \
            deploy/docker-compose.yml \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/angelo-cicd/docker-compose.yml"

      - name: Deploy
        run: |
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | \
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin &&
             cd /opt/angelo-cicd &&
             mkdir -p letsencrypt &&
             touch letsencrypt/acme.json &&
             chmod 600 letsencrypt/acme.json &&
             docker compose pull ${SERVICE} &&
             docker compose up -d traefik ${SERVICE}"
